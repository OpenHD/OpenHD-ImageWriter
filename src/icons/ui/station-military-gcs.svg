<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <g fill="none" stroke="#ffffff" stroke-linecap="round" stroke-linejoin="round">
    <!-- Rugged Pelican / Hardcase Base & Rim -->
    <path d="M68 330 L444 330 L428 444 C428 456 414 464 400 464 L112 464 C98 464 84 456 84 444 Z" 
          fill="#ffffff" fill-opacity="0.22" stroke-width="16"/>
    <!-- Open Rugged Case Lid -->
    <path d="M84 100 C84 88 98 80 112 80 L400 80 C414 80 428 88 428 100 L444 330 L68 330 Z" 
          fill="#ffffff" fill-opacity="0.12" stroke-width="16"/>
    <!-- Heavy Duty Case Ribs/Latches -->
    <line x1="130" y1="80" x2="130" y2="464" stroke-width="8" opacity="0.4"/>
    <line x1="382" y1="80" x2="382" y2="464" stroke-width="8" opacity="0.4"/>
    <!-- Dual Military Tactical Displays in Lid -->
    <rect x="100" y="116" width="144" height="184" rx="8" fill="#ffffff" fill-opacity="0.25" stroke-width="10"/>
    <rect x="268" y="116" width="144" height="184" rx="8" fill="#ffffff" fill-opacity="0.25" stroke-width="10"/>
    <!-- Tactical Map / Horizon on Left Display -->
    <line x1="120" y1="208" x2="224" y2="208" stroke-width="6"/>
    <circle cx="172" cy="208" r="28" stroke-width="6" stroke-dasharray="10 8"/>
    <!-- Telemetry Data on Right Display -->
    <line x1="288" y1="146" x2="394" y2="146" stroke-width="6"/>
    <line x1="288" y1="172" x2="370" y2="172" stroke-width="6"/>
    <line x1="288" y1="198" x2="386" y2="198" stroke-width="6"/>
    <line x1="288" y1="224" x2="340" y2="224" stroke-width="6"/>
    <!-- Lower Control Panel in Base -->
    <rect x="108" y="352" width="296" height="88" rx="8" fill="#ffffff" fill-opacity="0.2" stroke-width="10"/>
    <!-- Left Tactical Joystick -->
    <circle cx="160" cy="396" r="22" stroke-width="8"/>
    <circle cx="160" cy="396" r="8" fill="#ffffff"/>
    <!-- Center Keyboard / Status Array -->
    <rect x="212" y="372" width="88" height="48" rx="4" stroke-width="6"/>
    <line x1="222" y1="388" x2="290" y2="388" stroke-width="4"/>
    <line x1="222" y1="404" x2="290" y2="404" stroke-width="4"/>
    <!-- Right Tactical Joystick -->
    <circle cx="352" cy="396" r="22" stroke-width="8"/>
    <circle cx="352" cy="396" r="8" fill="#ffffff"/>
    <!-- Mil-Spec Side Antenna Mast -->
    <line x1="452" y1="330" x2="472" y2="60" stroke-width="12"/>
    <circle cx="474" cy="52" r="8" fill="#ffffff"/>
  </g>
</svg>