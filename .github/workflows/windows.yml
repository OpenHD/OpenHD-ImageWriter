name: Windows ImageWriter build and SignPath signing

on:
  workflow_call:
    inputs:
      source-repository:
        description: Source repository; signed builds use the canonical ImageWriter repository
        type: string
        default: OpenHD/OpenHD-ImageWriter
      source-ref:
        description: Full OpenHD-ImageWriter source commit SHA
        type: string
        required: true
      sign:
        description: Sign using ImageWriter's approved SignPath project
        type: boolean
        default: false
      signing-mode:
        description: Test or release signing; test artifacts are not for distribution
        type: string
        default: release
      test-certificate-base64:
        description: Public self-signed onboarding certificate (DER, base64)
        type: string
        default: ''
      organization-id:
        type: string
        default: ''
      project-slug:
        type: string
        default: ''
      signing-policy-slug:
        type: string
        default: ''
    secrets:
      SIGNPATH_API_TOKEN:
        required: false

permissions:
  contents: read
  actions: read

env:
  BUILD_TYPE: Release

jobs:
  windows:
    runs-on: windows-latest

    # Signing is requested only by the manual workflow in the ImageWriter origin.
    # Pull requests and normal ImageWriter builds always remain unsigned.

    defaults:
      run:
        working-directory: src

    steps:
    - name: Validate SignPath configuration
      if: inputs.sign
      shell: pwsh
      working-directory: ${{ github.workspace }}
      env:
        SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
        SIGNPATH_ORGANIZATION_ID: ${{ inputs.organization-id }}
        SIGNPATH_PROJECT_SLUG: ${{ inputs.project-slug }}
        SIGNPATH_SIGNING_POLICY_SLUG: ${{ inputs.signing-policy-slug }}
        SOURCE_REPOSITORY: ${{ inputs.source-repository }}
        SOURCE_REF: ${{ inputs.source-ref }}
        SIGNING_MODE: ${{ inputs.signing-mode }}
        TEST_CERTIFICATE_BASE64: ${{ inputs.test-certificate-base64 }}
      run: |
        if ($Env:GITHUB_REPOSITORY -ne 'OpenHD/OpenHD-ImageWriter' -or $Env:GITHUB_EVENT_NAME -ne 'workflow_dispatch') {
          throw "Signing must be requested by the manual ImageWriter workflow"
        }
        if ($Env:SOURCE_REF -ne $Env:GITHUB_SHA) {
          throw 'Signed source must match the workflow revision for origin verification'
        }
        if ($Env:SIGNING_MODE -notin @('test', 'release')) {
          throw 'signing-mode must be test or release'
        }
        if ($Env:SIGNING_MODE -eq 'test' -and [string]::IsNullOrWhiteSpace($Env:TEST_CERTIFICATE_BASE64)) {
          throw 'Test signing requires the public SignPath test certificate'
        }
        if ($Env:SOURCE_REPOSITORY -ne 'OpenHD/OpenHD-ImageWriter') {
          throw "Signed builds must use the canonical ImageWriter source repository"
        }
        foreach ($name in @('SIGNPATH_API_TOKEN', 'SIGNPATH_ORGANIZATION_ID', 'SIGNPATH_PROJECT_SLUG', 'SIGNPATH_SIGNING_POLICY_SLUG')) {
          if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
            throw "Missing required SignPath setting: $name"
          }
        }

    - name: Validate source revision
      shell: pwsh
      working-directory: ${{ github.workspace }}
      env:
        SOURCE_REF: ${{ inputs.source-ref }}
      run: |
        if ($Env:SOURCE_REF -notmatch '^[0-9a-fA-F]{40}$') {
          throw "source-ref must be the full ImageWriter commit SHA"
        }

    - uses: actions/checkout@v5
      with:
        repository: ${{ inputs.source-repository }}
        ref: ${{ inputs.source-ref }}
        persist-credentials: false

    - name: Trust the pinned onboarding certificate on this test runner
      if: inputs.sign && inputs.signing-mode == 'test'
      shell: pwsh
      working-directory: ${{ github.workspace }}
      env:
        TEST_CERTIFICATE_BASE64: ${{ inputs.test-certificate-base64 }}
      run: |
        & scripts/trust_signpath_test_certificate.ps1 -CertificateBase64 $Env:TEST_CERTIFICATE_BASE64

    - name: Install Qt
      id: qt-install
      uses: jurplel/install-qt-action@v4
      with:
        version: '5.15.2'
        aqtversion: '==3.1.*'
        host: windows
        target: desktop
        arch: win32_mingw81
        setup-python: false
        tools: tools_cmake tools_mingw81,qt.tools.win32_mingw810

    - name: Download and Extract OpenSSL
      shell: pwsh
      working-directory: ${{ github.workspace }}
      run: |
        Invoke-WebRequest `
          -Uri "https://download.firedaemon.com/FireDaemon-OpenSSL/openssl-1.1.1w.zip" `
          -OutFile openssl-1.1.1w.zip
        Expand-Archive openssl-1.1.1w.zip -DestinationPath openssl111
      
    - name: Copy OpenSSL to Qt MinGW path
      shell: pwsh
      working-directory: ${{ github.workspace }}
      run: |
          dir ${{ github.workspace }}\..\Qt\
          dir ${{ github.workspace }}\..\Qt\Tools\
          dir ${{ github.workspace }}\..\Qt\Tools\mingw810_32\
      
          $openssl = (Get-ChildItem -Directory -Path "${{ github.workspace }}\openssl111" | Where-Object { $_.Name -like "openssl-*" } | Select-Object -First 1).FullName + "\x86"
          $mingwRoot = "${{ github.workspace }}\..\Qt\Tools\mingw810_32"
      
          Write-Host "Resolved OpenSSL path: $openssl"
          if (Test-Path $openssl) {
            Get-ChildItem -Recurse "$openssl" | ForEach-Object { Write-Host $_.FullName }
          } else {
            Write-Error "OpenSSL path not found: $openssl"
          }
      
          Copy-Item "$openssl\bin\libcrypto-1_1.dll" "$mingwRoot\bin\" -Force
          Copy-Item "$openssl\bin\libssl-1_1.dll"    "$mingwRoot\bin\" -Force
          Copy-Item "$openssl\lib\libcrypto.lib"     "$mingwRoot\lib\" -Force
          Copy-Item "$openssl\lib\libssl.lib"        "$mingwRoot\lib\" -Force
          New-Item -ItemType Directory -Force -Path "$mingwRoot\include\openssl"
          Write-Host "Copying OpenSSL headers from: $openssl\include\openssl\."
          Copy-Item "$openssl\include\openssl\." "$mingwRoot\include\" -Recurse -Force -Verbose
          dir "$mingwRoot\include\openssl\"

    - name: Install NSIS
      run: choco install nsis --x86 --force -y

    - name: Show Qt & CMake Info
      run: |
        where gcc
        where g++
        cmake --version

    - name: Debug OpenSSL include headers
      shell: pwsh
      working-directory: ${{ github.workspace }}
      run: |
        $opensslInclude = "$Env:GITHUB_WORKSPACE\..\Qt\Tools\mingw810_32\include\openssl"
        $openssl = (Get-ChildItem -Directory -Path "${{ github.workspace }}\openssl111" | Where-Object { $_.Name -like "openssl-*" } | Select-Object -First 1).FullName + "\x86"

        Write-Host "Looking in: $opensslInclude"
        if (Test-Path $opensslInclude) {
          Get-ChildItem $opensslInclude | Select-Object -First 20
        } else {
          Write-Error "OpenSSL include directory not found!"
        }
        
        dir "$openssl\include\openssl\"
        

    - name: Configure CMake
      shell: cmd
      working-directory: src
      run: |
        dir "%GITHUB_WORKSPACE%\openssl111\openssl-1.1\x86\include"
        mkdir build
        cd build
        cmake .. -G "MinGW Makefiles" ^
        -DCMAKE_BUILD_TYPE=Release ^
        -DCMAKE_C_COMPILER="%GITHUB_WORKSPACE%\..\Qt\Tools\mingw810_32\bin\gcc.exe" ^
        -DCMAKE_CXX_COMPILER="%GITHUB_WORKSPACE%\..\Qt\Tools\mingw810_32\bin\g++.exe" ^
        -DOPENSSL_INCLUDE_DIR="%GITHUB_WORKSPACE%\openssl111\openssl-1.1\x86\include" ^
        -DOPENSSL_LIBRARIES="%GITHUB_WORKSPACE%\openssl111\openssl-1.1\x86\lib"


    - name: Check CMake Cache
      run: |
        dir build
        type build\CMakeCache.txt || echo "Cache missing"

    - name: Build
      shell: pwsh
      run: |
        $env:PATH = "$Env:GITHUB_WORKSPACE\..\Qt\5.15.2\mingw81_32\bin;$Env:GITHUB_WORKSPACE\..\Qt\Tools\mingw810_32\bin;$env:PATH"
        cd build
        cmake --build . --verbose

    - name: Copy OpenSSL DLLs to build folder
      shell: pwsh
      run: |
        Copy-Item "$Env:GITHUB_WORKSPACE\..\Qt\Tools\mingw810_32\bin\libssl-1_1.dll" -Destination "$Env:GITHUB_WORKSPACE\src\build\"
        Copy-Item "$Env:GITHUB_WORKSPACE\..\Qt\Tools\mingw810_32\bin\libcrypto-1_1.dll" -Destination "$Env:GITHUB_WORKSPACE\src\build\"

    - name: Prepare application and uninstaller for signing
      if: inputs.sign
      shell: pwsh
      working-directory: src/build
      run: |
        $stage = Join-Path $Env:RUNNER_TEMP 'imagewriter-unsigned-application'
        New-Item -ItemType Directory -Force -Path $stage | Out-Null
        & "${Env:ProgramFiles(x86)}\NSIS\makensis.exe" /DINNER "/DUNINSTALLER_OUTPUT=$stage\uninstall.exe" openhdimagewriter.nsi
        if ($LASTEXITCODE -ne 0) { throw 'Building the uninstaller generator failed' }
        $generator = Start-Process -FilePath (Join-Path $PWD 'ImageWriter-uninstaller-generator.exe') -WindowStyle Hidden -Wait -PassThru
        if ($generator.ExitCode -ne 0 -or -not (Test-Path -LiteralPath "$stage\uninstall.exe")) {
          throw 'Generating the uninstaller failed'
        }
        Copy-Item deploy/OpenHDImageWriter.exe, deploy/fat32format.exe -Destination $stage

    - name: Upload unsigned application
      if: inputs.sign
      id: unsigned-application
      uses: actions/upload-artifact@v4
      with:
        name: ImageWriter-unsigned-application
        path: ${{ runner.temp }}/imagewriter-unsigned-application/*
        if-no-files-found: error
        retention-days: 7

    - name: Sign application, formatter and uninstaller with SignPath
      if: inputs.sign
      uses: signpath/github-action-submit-signing-request@v3
      with:
        api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
        organization-id: ${{ inputs.organization-id }}
        project-slug: ${{ inputs.project-slug }}
        signing-policy-slug: ${{ inputs.signing-policy-slug }}
        artifact-configuration-slug: imagewriter-application
        github-artifact-id: ${{ steps.unsigned-application.outputs.artifact-id }}
        wait-for-completion: true
        wait-for-completion-timeout-in-seconds: 1800
        output-artifact-directory: ${{ runner.temp }}/imagewriter-signed-application

    - name: Verify and stage signed application
      if: inputs.sign
      shell: pwsh
      working-directory: ${{ github.workspace }}
      env:
        SIGNING_MODE: ${{ inputs.signing-mode }}
      run: |
        foreach ($file in @('OpenHDImageWriter.exe', 'fat32format.exe', 'uninstall.exe')) {
          $source = Join-Path $Env:RUNNER_TEMP "imagewriter-signed-application/$file"
          & scripts/verify_windows_signature.ps1 -Path $source -SigningMode $Env:SIGNING_MODE -ExpectedSignerThumbprint $Env:SIGNPATH_TEST_CERTIFICATE_THUMBPRINT
          Copy-Item -LiteralPath $source -Destination "src/build/deploy/$file" -Force
        }

    - name: Build NSIS installer
      shell: pwsh
      working-directory: src/build
      env:
        SIGN_BUILD: ${{ inputs.sign }}
      run: |
        $arguments = @('openhdimagewriter.nsi')
        if ($Env:SIGN_BUILD -eq 'true') {
          $arguments = @('/DSIGNED_UNINSTALLER=deploy\uninstall.exe') + $arguments
        }
        & "${Env:ProgramFiles(x86)}\NSIS\makensis.exe" @arguments
        if ($LASTEXITCODE -ne 0) { throw 'Building the NSIS installer failed' }

    - name: Upload unsigned installer
      if: inputs.sign
      id: unsigned-installer
      uses: actions/upload-artifact@v4
      with:
        name: ImageWriter-unsigned-installer
        path: src/build/OpenHD-ImageWriter-*.exe
        if-no-files-found: error
        retention-days: 7

    - name: Sign installer with SignPath
      if: inputs.sign
      uses: signpath/github-action-submit-signing-request@v3
      with:
        api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
        organization-id: ${{ inputs.organization-id }}
        project-slug: ${{ inputs.project-slug }}
        signing-policy-slug: ${{ inputs.signing-policy-slug }}
        artifact-configuration-slug: imagewriter-installer
        github-artifact-id: ${{ steps.unsigned-installer.outputs.artifact-id }}
        wait-for-completion: true
        wait-for-completion-timeout-in-seconds: 1800
        output-artifact-directory: ${{ runner.temp }}/imagewriter-signed-installer

    - name: Verify and stage signed installer
      if: inputs.sign
      shell: pwsh
      working-directory: ${{ github.workspace }}
      env:
        SIGNING_MODE: ${{ inputs.signing-mode }}
      run: |
        $installers = @(Get-ChildItem "$Env:RUNNER_TEMP/imagewriter-signed-installer/OpenHD-ImageWriter-*.exe")
        if ($installers.Count -ne 1) { throw 'Expected exactly one signed installer' }
        & scripts/verify_windows_signature.ps1 -Path $installers[0].FullName -SigningMode $Env:SIGNING_MODE -ExpectedSignerThumbprint $Env:SIGNPATH_TEST_CERTIFICATE_THUMBPRINT
        Copy-Item -LiteralPath $installers[0].FullName -Destination src/build -Force

    - name: Upload installer
      uses: actions/upload-artifact@v4
      with:
        name: OpenHDImageWriter-Build-Full${{ inputs.sign && (inputs.signing-mode == 'test' && '-Test-Signed' || '-Signed') || '-Unsigned' }}
        path: src/build/OpenHD-ImageWriter-*.exe
        if-no-files-found: error

    - name: Upload portable application
      uses: actions/upload-artifact@v4
      with:
        name: OpenHDImageWriter-Windows-Portable${{ inputs.sign && (inputs.signing-mode == 'test' && '-Test-Signed' || '-Signed') || '-Unsigned' }}
        path: src/build/deploy/
        if-no-files-found: error

