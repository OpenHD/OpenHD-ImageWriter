name: OpenHD Image Writer Windows

on:
  push:
    branches:
      - "2.5-evo"
      - "dev-release"
      - "release"
      - "debug_older2"
    paths-ignore:
      - '**.md'
      - '**.asciidoc'
      - '**.adoc'
      - '.gitignore'
      - 'LICENSE'

env:
  BUILD_TYPE: Release

jobs:
  build:
    runs-on: windows-latest

    defaults:
      run:
        working-directory: src

    steps:
    - uses: actions/checkout@v3

    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: '5.15.2'
        aqtversion: '==3.1.*'
        host: windows
        target: desktop
        arch: win32_mingw81
        setup-python: false
        tools: tools_cmake tools_mingw81,qt.tools.win32_mingw810

    - name: Download OpenSSL 1.1.1 ZIP
      shell: pwsh
      run: |
        Invoke-WebRequest `
          -Uri "https://download.firedaemon.com/FireDaemon-OpenSSL/openssl-1.1.1w.zip" `
          -OutFile "src/openssl-1.1.1w.zip"
        Expand-Archive "src/openssl-1.1.1w.zip" -DestinationPath "src/openssl111"

    - name: Copy 32‑bit DLLs & libs
      shell: pwsh
      run: |
        $opensslPath = "${{ github.workspace }}\src\openssl111\x86"
        $mingwPath = "C:\tools\msys64\mingw32"
        Copy-Item "$opensslPath\bin\libcrypto-1_1.dll" "$mingwPath\bin\" -Force
        Copy-Item "$opensslPath\bin\libssl-1_1.dll"    "$mingwPath\bin\" -Force
        Copy-Item "$opensslPath\lib\libcrypto.dll.a"   "$mingwPath\lib\" -Force
        Copy-Item "$opensslPath\lib\libssl.dll.a"      "$mingwPath\lib\" -Force
        Copy-Item "$opensslPath\include\openssl\*.h"   "$mingwPath\include\openssl\" -Force

    - name: Install dependencies
      run: choco install nsis --x86 --force -y

    - name: Show Qt Install Info
      run: |
        where gcc
        where g++
        cmake --version

    - name: Configure CMake
      shell: cmd
      working-directory: src
      run: |
        mkdir build
        cd build
        cmake .. -G "MinGW Makefiles" ^
          -DCMAKE_BUILD_TYPE=Release ^
          -DCMAKE_C_COMPILER="${{ github.workspace }}\Qt\Tools\mingw810_32\bin\gcc.exe" ^
          -DCMAKE_CXX_COMPILER="${{ github.workspace }}\Qt\Tools\mingw810_32\bin\g++.exe"

    - name: Check CMake Cache
      run: |
        dir build
        type build\CMakeCache.txt || echo "Cache missing"

    - name: Build
      shell: pwsh
      run: |
        $env:PATH = "${{ github.workspace }}\Qt\5.15.2\mingw81_32\bin;${{ github.workspace }}\Qt\Tools\mingw810_32\bin;" + $env:PATH
        cd build
        cmake --build . --verbose

    - name: Copy OpenSSL DLLs to build folder
      shell: pwsh
      run: |
        $opensslPath = "${{ github.workspace }}\src\openssl111\x86\bin"
        Copy-Item "$opensslPath\libssl-1_1.dll" -Destination "${{ github.workspace }}\src\build\"
        Copy-Item "$opensslPath\libcrypto-1_1.dll" -Destination "${{ github.workspace }}\src\build\"

    - name: Build NSIS Installer
      shell: pwsh
      working-directory: src/build
      run: |
        & "${env:ProgramFiles(x86)}\NSIS\makensis.exe" "openhdimagewriter.nsi"

    - name: Upload Installer
      uses: actions/upload-artifact@v4
      with:
        name: OpenHDImageWriter-Build-Full
        path: src/build/OpenHD-ImageWriter-*
        if-no-files-found: error
