name: OpenHD Image Writer macOS

on:
  workflow_dispatch:
  push:
    branches:
      - "2.5-evo"
      - "dev-branch"
      - "release"
      - "testing"
    paths-ignore:
      - "**.md"
      - "**.asciidoc"
      - "**.adoc"
      - ".gitignore"
      - "LICENSE"

permissions:
  contents: read

env:
  BUILD_TYPE: Release

jobs:
  build:
    name: Build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: macos-15-intel
            deployment_target: "10.13"
            qt_source: archive
          - arch: arm64
            runner: macos-15
            deployment_target: "11.0"
            qt_source: homebrew

    defaults:
      run:
        working-directory: src

    steps:
      - uses: actions/checkout@v5

      - name: Install Qt for Intel
        if: matrix.qt_source == 'archive'
        uses: jurplel/install-qt-action@v4
        with:
          version: "5.15.2"
          host: mac
          target: desktop
          arch: clang_64
          cache: true

      - name: Install Qt for Apple Silicon
        if: matrix.qt_source == 'homebrew'
        run: |
          brew install qt@5
          qt_prefix="$(brew --prefix qt@5)"
          echo "$qt_prefix/bin" >> "$GITHUB_PATH"
          echo "CMAKE_PREFIX_PATH=$qt_prefix" >> "$GITHUB_ENV"

      - name: Show build environment
        run: |
          uname -m
          cmake --version
          qmake -v

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE="$BUILD_TYPE" \
            -DCMAKE_OSX_ARCHITECTURES="${{ matrix.arch }}" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="${{ matrix.deployment_target }}" \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5

      - name: Build
        run: cmake --build build --config "$BUILD_TYPE" --parallel

      - name: Test
        run: ctest --test-dir build --build-config "$BUILD_TYPE" --output-on-failure

      - name: Verify architecture
        run: |
          executable="build/OpenHDImageWriter.app/Contents/MacOS/OpenHDImageWriter"
          test -x "$executable"
          file "$executable"
          lipo "$executable" -verify_arch "${{ matrix.arch }}"

      - name: Create DMG
        run: |
          dmg="OpenHDImageWriter-macOS-${{ matrix.arch }}.dmg"
          hdiutil create \
            -volname "OpenHD ImageWriter" \
            -srcfolder build/OpenHDImageWriter.app \
            -ov \
            -format UDZO \
            "build/$dmg"

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: OpenHDImageWriter-macOS-${{ matrix.arch }}
          path: src/build/OpenHDImageWriter-macOS-${{ matrix.arch }}.dmg
          if-no-files-found: error
